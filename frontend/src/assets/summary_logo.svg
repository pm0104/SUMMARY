<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients matching the reference isometric cube logo -->
    <linearGradient id="topOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="leftRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="rightTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Rounded Container for Contrast & App Icon Feel -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#18181b" stroke="#27272a" stroke-width="1.5" />

  <!-- Isometric Cube Faces (with clean Y-shaped negative space gap) -->
  <g filter="url(#cubeShadow)">
    <!-- Top Face (Orange Diamond) -->
    <polygon points="50,14 76,29 50,44 24,29" fill="url(#topOrange)" />

    <!-- Left Face (Red/Coral Polygon) -->
    <polygon points="22,33 46,47 46,77 22,63" fill="url(#leftRed)" />

    <!-- Right Face (Teal/Cyan Polygon) -->
    <polygon points="78,33 78,63 54,77 54,47" fill="url(#rightTeal)" />
  </g>
</svg>
